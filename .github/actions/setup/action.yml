# Composite setup shared by every workflow that needs the toolchain: Vite+
# (`voidzero-dev/setup-vp`, #565), which installs `vp` at the catalog's
# `vite-plus` pin, the Node.js runtime and the pnpm that package.json's
# `packageManager` names, and caches the dependency store (keyed on
# pnpm-lock.yaml); then a frozen-lockfile install and the repository's own
# `prepare` script. `vp` and
# the dev bins land in node_modules/.bin; later steps call them through
# `pnpm exec` rather than through a `GITHUB_PATH` entry, which zizmor flags
# (a step that can write the path can shadow every later command). Copied in
# shape from effect-jsonapi (the library reference).
#
# Install scripts: pnpm 11 runs a dependency's lifecycle scripts only when
# pnpm-workspace.yaml's `allowBuilds` names it (better-sqlite3, the native
# driver the storage adapters test against; esbuild; msgpackr-extract), so the
# test job installs normally. The privileged release job passes
# `ignore-scripts: "true"` so no dependency script at all runs where a publish
# credential exists — it only builds, and the build needs no native module. In
# both, the repository's OWN `prepare` script (the Effect-patched TypeScript
# every gate runs on) is first-party and runs explicitly as its own step.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Vite+, Node.js and pnpm, restore the package cache, install dependencies and patch the toolchain.
inputs:
  node-version:
    # Empty: Vite+ resolves the runtime (the project's setting, else the
    # latest LTS release), never a pre-release. Pass a version to pin one.
    description: The Node.js version to set up (empty lets Vite+ choose).
    required: false
    default: ""
  ignore-scripts:
    description: Skip every dependency lifecycle script (the release job sets this).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # One action for the toolchain: `vp` (its version read from the catalog's
    # `vite-plus` entry), Node.js and pnpm (`packageManager`), plus the
    # dependency cache. It does not install: the retried step below does, so
    # the release job's `ignore-scripts` still applies.
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: true
        run-install: false

    # Retried: pnpm's linker can race itself when a package with a build
    # script resolves twice and both copies build — a transient ENOENT on the
    # rename of a `_tmp_<pid>_<hex>` staging directory, seen on cold-store runs
    # elsewhere in this library family. Every attempt keeps `--frozen-lockfile`,
    # so a deterministic failure (lockfile drift, a policy violation) still
    # fails all three.
    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        flags="--frozen-lockfile"
        if [ "$IGNORE_SCRIPTS" = "true" ]; then
          flags="$flags --ignore-scripts"
        fi
        for attempt in 1 2 3; do
          if pnpm install $flags; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::pnpm install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::pnpm install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
        if [ "$IGNORE_SCRIPTS" = "true" ]; then
          # The one lifecycle script that does run: ours. See the header.
          pnpm run prepare
        fi
