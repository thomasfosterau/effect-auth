name: Auto-assign

# Assigns the owner to every pull request that opens without an assignee, so
# none sits unowned in the queue. Dependabot assigns the owner itself
# (`assignees` in dependabot.yml), and its token is read-only here, so its PRs
# are skipped. The Changesets version PR is opened with GITHUB_TOKEN, which
# does not trigger workflows, so it is not covered.
#
# `pull_request`, not `pull_request_target`: no checkout and no code from the
# PR runs, and the job holds only the write scopes assignment needs.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  assign:
    name: Assign the owner
    if: >-
      github.actor != 'dependabot[bot]' &&
      toJSON(github.event.pull_request.assignees) == '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Assign thomasfosterau
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
