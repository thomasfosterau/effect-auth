name: Release

# Changesets release flow, split so that only publishing waits for approval.
# On every push to `trunk`:
#
# - `select` (read-only) asks changesets/action/select-mode what the repo state
#   calls for: `version` while unreleased changesets exist, `publish` once none
#   remain and some package version is not on npm yet (`changeset
#   publish-plan`), else `none`.
# - `version` opens/updates the "chore: version packages" PR. It holds a
#   write-scoped token but no `id-token`, so it cannot publish, and runs outside
#   the `release` environment, so it needs no approval.
# - `publish` is the only job in the protected `release` environment and the
#   only one with `id-token: write`: it publishes to npm via OIDC trusted
#   publishing and tags the release, after the owner approves it (once per
#   release). See PUBLISHING.md.
#
# changesets/action's README recommends its sub-actions over the combined
# action for trusted publishing, "to tighten publish permissions"; they need
# Changesets CLI v3. The version and publish sub-actions push through the
# GitHub API, so no checkout keeps git credentials.

on:
  push:
    branches: [trunk]

# No permissions by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  # Same setup as `publish` (see the comments there), minus the build.
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/effect-auth' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env: &id001
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+, Node.js and the `packageManager` pnpm, then a frozen install
      # with --ignore-scripts: no dependency lifecycle script runs in the
      # release jobs. The repository's own `prepare` script (the
      # Effect-patched TypeScript the build runs on) runs on its own after.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Patch the toolchain
        run: pnpm run prepare
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env: *id001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+, Node.js and the `packageManager` pnpm, then a frozen install
      # with --ignore-scripts: no dependency lifecycle script runs in the
      # release jobs. The repository's own `prepare` script (the
      # Effect-patched TypeScript the build runs on) runs on its own after.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Patch the toolchain
        run: pnpm run prepare
      - name: Create or update the version PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    name: Publish to npm
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    # That guard is on `select` now: this job needs it, so it is skipped with it.
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One publish at a time; never cancel one that has started.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the release tags and create the GitHub releases
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` it compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs WITH
      # lifecycle scripts, ignoring the setup action's `--ignore-scripts`. That
      # would run every `allowBuilds` dependency's build script inside this
      # job, which holds `id-token: write`. It triggers whenever a manifest's
      # mtime moves after the install step, e.g. when the Changesets action
      # checks out an existing `changeset-release/trunk` and `git reset
      # --hard`s it before `pnpm run version`. Scoped to this job: CI and
      # local runs keep the default. pnpm 11 reads only the `pnpm_config_*`
      # spelling.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+, Node.js and the `packageManager` pnpm, then a frozen install
      # with --ignore-scripts: no dependency lifecycle script runs in the
      # release jobs. The repository's own `prepare` script (the
      # Effect-patched TypeScript the build runs on) runs on its own after.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Patch the toolchain
        run: pnpm run prepare

      # Trusted publishing needs npm >= 11.5.1 on the runner, whichever client
      # performs the publish. Pinned to a major rather than `@latest`, so a new
      # npm major can't arrive unreviewed in the job holding `id-token: write`.
      - name: Update npm
        run: npm install -g npm@11

      - name: Build
        run: pnpm exec vp run build

      # Once the version PR has merged (no changesets remain), this runs `pnpm
      # run release`, which publishes every non-private package under packages/
      # with `pnpm publish` — npm OIDC trusted publishing (there is no NPM_TOKEN
      # to steal; provenance is left to npm) — and then `changeset tag`. The
      # action parses the "New tag:" output, pushes the tags and creates the
      # GitHub releases.
      #
      # `pnpm publish`, not `npm publish`: pnpm 11 supports trusted publishing,
      # and it is what rewrites the `catalog:` / `catalog:peers` / `workspace:*`
      # specifiers in each package.json into the ranges consumers actually see —
      # npm would publish the literal protocols.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in the
      # catalog) and renamed its inputs from v1's `version` / `publish` /
      # `commit` / `title`.
      - name: Publish to npm
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't force provenance; npm attaches it itself when allowed, and an
          # explicit request fails from a private repository.
