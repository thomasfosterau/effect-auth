name: Release

on:
  push:
    branches: [trunk]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    if: github.repository == 'thomasfosterau/effect-auth' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` it compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs WITH
      # lifecycle scripts, ignoring the setup action's `--ignore-scripts`. That
      # would run every `allowBuilds` dependency's build script inside this
      # job, which holds `id-token: write`. It triggers whenever a manifest's
      # mtime moves after the install step, e.g. when the Changesets action
      # checks out an existing `changeset-release/trunk` and `git reset
      # --hard`s it before `pnpm run version`. Scoped to this job: CI and
      # local runs keep the default. pnpm 11 reads only the `pnpm_config_*`
      # spelling.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs with --ignore-scripts (dependency install scripts never run in
      # the privileged publish job) and then runs only the repository's own
      # `prepare` script; see the action's header.
      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"

      # Trusted publishing needs npm >= 11.5.1 on the runner, whichever client
      # performs the publish. Pinned to a major rather than `@latest`, so a new
      # npm major can't arrive unreviewed in the job holding `id-token: write`.
      - name: Update npm
        run: npm install -g npm@11

      - name: Build
        run: pnpm exec vp run build

      # When changesets are pending, this opens/updates a "Version Packages" PR
      # (via `pnpm run version`). Once that PR is merged (no changesets remain),
      # it runs `pnpm run release`, which publishes every non-private package
      # under packages/ with `pnpm publish` — npm OIDC trusted publishing (there is no
      # NPM_TOKEN to steal; provenance is left to npm) — and then `changeset tag`.
      # The action parses the "New tag:" output, pushes the tags and creates the
      # GitHub releases.
      #
      # `pnpm publish`, not `npm publish`: pnpm 11 supports trusted publishing,
      # and it is what rewrites the `catalog:` / `catalog:peers` / `workspace:*`
      # specifiers in each package.json into the ranges consumers actually see —
      # npm would publish the literal protocols.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in the
      # catalog) and renamed its inputs from v1's `version` / `publish` /
      # `commit` / `title`.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't force provenance; npm attaches it itself when allowed, and an
          # explicit request fails from a private repository.
