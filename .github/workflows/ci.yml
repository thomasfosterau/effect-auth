name: CI

# ONE required job (plus the non-required `alchemy` job below): the pipeline's task graph lives in vite.config.ts / vite.tasks.ts
# (each package's `build`, `check` and `test:unit`, each depending on the
# builds of the workspace packages it imports), not in GitHub Actions `needs:`.
# Shape copied from effect-jsonapi (the library reference).

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the job grants only read access.
permissions: {}

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-

      - name: Format & lint
        run: vp check

      - name: Build packages
        run: vp run build

      - name: API docs (docgen type-checks and runs every JSDoc example)
        run: vp run docs

      - name: Dist import smoke (each package's effect peer floor)
        run: vp run check:dist

      - name: Dist import smoke (catalog effect)
        run: vp run check:dist -- --effect catalog

      - name: Type check
        run: vp run check

      - name: Unit tests
        run: vp run -r test:unit

      - name: Audit
        run: pnpm audit --audit-level high

  # The one suite that needs the alchemy runtime (`AuthSchema.test.ts`, the
  # package's `test:alchemy` task), kept in its own job so an alchemy break
  # shows up on its own line. alchemy 2.0.0-beta.80 is the first release that
  # imports only `effect/*` paths (effect-auth#250). Do not skip the test.
  #
  # The job also runs a Postgres server, so `test:alchemy`'s Postgres cases
  # (`AuthSchema` and the `./postgres` stores over `@effect/sql-pg`, #184) run
  # against a real server rather than skipping.
  alchemy:
    name: "Alchemy runtime"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://auth:auth@localhost:5432/auth
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: AuthSchema tests against the alchemy runtime
        run: vp run --filter @thomasfosterau/effect-auth-alchemy test:alchemy
