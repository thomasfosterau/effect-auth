name: CI

# One workflow, one command: after checkout, Vite+ setup and a frozen install,
# the job runs `vp run ci` (the root `ci` task in vite.config.ts), a fail-fast
# chain of every gate in CI's order (AGENTS.md, Verification): build, format
# and lint, docs, the two dist smokes, the type gate, the unit suites, the
# audit, then the alchemy runtime suites. The task graph lives in
# vite.config.ts / vite.tasks.ts, not in GitHub Actions `needs:`.
#
# Branch protection requires each matrix leg by name: `ci (node lts)` and
# `ci (node latest)`. There is no aggregate job.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default; each job grants only read access.
permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    # alchemy-postgres's `Postgres.test.ts` and the real-server case of its
    # `AuthSchema.test.ts` need a server (`DATABASE_URL`; without one they
    # skip). Kept as the old `alchemy` job had it; `test:alchemy` is a cached
    # task that declares no environment variables, so the variable does not
    # reach those cases yet (#766).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://auth:auth@localhost:5432/auth
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+, Node.js and the `packageManager` pnpm, and the dependency
      # cache; the install is the next step. `latest` maps to the semver range
      # `*`, the newest stable release: Vite+ resolves the `latest` tag to the
      # head of the Node.js release index, which can be a pre-release (it was
      # v27.0.0-alpha when this was written).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node == 'latest' && '*' || matrix.node }}
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v2-${{ runner.os }}-node-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v2-${{ runner.os }}-node-${{ matrix.node }}-

      - name: CI
        run: vp run ci
