name: CI

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependent packages type-check against the core's built dist
      # (workspace exports point at dist/), so build before checking.
      - name: Build packages
        run: pnpm run build

      - name: Format & lint
        run: pnpm run check

      - name: Run tests
        run: pnpm run test

      - name: Type check
        run: pnpm run typecheck
