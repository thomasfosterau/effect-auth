name: CI

# ONE job: the pipeline's task graph lives in vite.config.ts / vite.tasks.ts
# (each package's `build`, `check` and `test:unit`, each depending on the
# builds of the workspace packages it imports), not in GitHub Actions `needs:`.
# Shape copied from effect-jsonapi (the library reference).

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the job grants only read access.
permissions: {}

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Format & lint
        run: vp check

      - name: Build packages
        run: vp run build

      - name: Type check
        run: vp run check

      - name: Unit tests
        run: vp run -r test:unit

      - name: Audit
        run: pnpm audit --audit-level high
