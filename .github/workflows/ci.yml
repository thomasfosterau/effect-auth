name: CI

# ONE required job (plus the non-required `alchemy` job below): the pipeline's task graph lives in vite.config.ts / vite.tasks.ts
# (each package's `build`, `check` and `test:unit`, each depending on the
# builds of the workspace packages it imports), not in GitHub Actions `needs:`.
# Shape copied from effect-jsonapi (the library reference).

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the job grants only read access.
permissions: {}

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Format & lint
        run: vp check

      - name: Build packages
        run: vp run build

      - name: Dist import smoke (effect peer floor)
        run: vp run check:dist

      - name: Dist import smoke (catalog effect)
        run: vp run check:dist -- --effect catalog

      - name: Type check
        run: vp run check

      - name: Unit tests
        run: vp run -r test:unit

      - name: Audit
        run: pnpm audit --audit-level high

  # The one suite that needs the alchemy runtime (`AuthSchema.test.ts`, the
  # package's `test:alchemy` task), kept in its own job so an alchemy break
  # shows up on its own line. alchemy 2.0.0-beta.80 is the first release that
  # imports only `effect/*` paths (effect-auth#250). Do not skip the test.
  alchemy:
    name: "Alchemy runtime"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: AuthSchema tests against the alchemy runtime
        run: vp run --filter @thomasfosterau/effect-auth-alchemy test:alchemy
