# Dependabot version updates. The `npm` ecosystem at `/` reads the pnpm
# workspace and its catalogs (pnpm-workspace.yaml), so one entry covers every
# package under packages/*.
#
# Groups collect the sets that MUST move together, so a lockstep set arrives as
# one PR and can never drift apart. Dependabot puts a dependency in the FIRST
# group that matches, so the groups run specific → general and `exclude-patterns`
# keeps a package out of a broader group that would otherwise claim it:
#
# - `toolchain`: `@effect/tsgo` patches the native `tsc` (`@typescript/native`)
#   and the oxlint that `vite-plus` pins, and hard-errors at install on any
#   pairing it has no artifact for; `vite`, `vitest` and `@vitest/*` must equal
#   what `vite-plus` bundles; `@enfect/oxlint` runs inside that oxlint. Check
#   the `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
#   before merging one of these PRs (the catalog comments say why).
# - `effect`: the Effect 4 release line is a lockstep singleton set (`effect`
#   plus the `@effect/*` packages pinned to the same release).
# - `docgen`: `@effect/docgen` runs every JSDoc example under `tsx`; claimed
#   before `effect`, whose `@effect/*` pattern would otherwise take it.
# - one group per framework family, the storage peers, Changesets and fallow.
# - `minor-and-patch`: everything else's minor and patch updates in one PR, so
#   PR volume stays low; a major outside a lockstep set stays its own PR.
#
# Ignored version updates (security updates stay enabled, because each ignore
# is scoped to `version-update:*` types):
# - `typescript` majors: it is the TS6 alias (`npm:@typescript/typescript6`)
#   that every JS-API consumer `require`s; Dependabot proposes TS7 there, which
#   breaks them (AGENTS.md, "TypeScript is split 6/7").
# - `drizzle-orm-effect`: the commit-suffixed drizzle 1.0 prerelease is pinned
#   to what the applications run; it moves with them, not with npm's `latest`.
#
# Moved by hand, because Dependabot cannot (AGENTS.md lists them too):
# - the npm-alias catalog entries: `vite` (`npm:@voidzero-dev/vite-plus-core`,
#   must equal `vite-plus`; `pnpm exec vp migrate` re-pins it, then drop the
#   `minimumReleaseAgeExclude` entries it adds), `typescript`
#   (`npm:@typescript/typescript6`) and `@typescript/native` (`npm:typescript`,
#   a version `@effect/tsgo`'s components table supports). Put them on the
#   `toolchain` PR's branch.
# - `@effect/tsgo` itself when a `vite-plus` bump outruns it: that PR fails at
#   `pnpm install` until a release whose table covers the new oxlint lands.
# - the transitive advisory floors in pnpm-workspace.yaml's `overrides`.
#   (The `vite@*` / `vitest@*` overrides read the catalog, so they follow.)
#
# `cooldown` is 1 day (Dependabot counts whole days only), longer than pnpm's
# `minimumReleaseAge` of 480 minutes (8 hours), so a Dependabot PR never
# proposes a version pnpm would still refuse. `@thomasfosterau/*` is exempt
# from both.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@enfect/oxlint"
      docgen:
        applies-to: version-updates
        patterns:
          - "@effect/docgen"
          - "tsx"
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/docgen"
      svelte:
        applies-to: version-updates
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "svelte-check"
          - "svelte2tsx"
          - "@testing-library/svelte"
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
      vue:
        applies-to: version-updates
        patterns:
          - "vue"
          - "@vue/*"
          - "vue-tsc"
          - "@vitejs/plugin-vue"
      solid:
        applies-to: version-updates
        patterns:
          - "solid-js"
          - "@solidjs/*"
          - "vite-plugin-solid"
      drizzle:
        applies-to: version-updates
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      alchemy:
        applies-to: version-updates
        patterns:
          - "alchemy"
          - "wrangler"
          - "@cloudflare/*"
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
      fallow:
        applies-to: version-updates
        patterns:
          - "fallow"
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-orm-effect"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
