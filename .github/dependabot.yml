# Dependabot version updates. The `npm` ecosystem at `/` reads the pnpm
# workspace and its catalogs (pnpm-workspace.yaml), so one entry covers every
# package under packages/*.
#
# Groups exist only for sets that MUST move together (exact cross-pins or a
# hard compatibility table), so updating one member alone breaks the install
# or the build; everything else gets its own PR. Dependabot puts a dependency
# in the FIRST group that matches, so `exclude-patterns` keeps a package out of
# a broader group that would otherwise claim it:
#
# - `toolchain`: `@effect/tsgo` patches the native `tsc` (`@typescript/native`)
#   and the oxlint that `vite-plus` pins, and hard-errors at install on any
#   pairing it has no artifact for; `vitest` and `@vitest/*` must equal what
#   `vite-plus` bundles. Check the `components` table in
#   node_modules/@effect/tsgo/dist/effect-tsgo.cjs before merging one of these
#   PRs (the catalog comments say why). `@enfect/oxlint` ranges its oxlint
#   plugin API (`@oxlint/plugins ^1.85.0`), so it moves on its own.
# - `effect`: the Effect 4 release line (`effect` plus the `@effect/*`
#   packages pinned to the same release), with `@effect/docgen`, which depends
#   on `effect` / `@effect/platform-node` at its own release's floor.
# - `svelte`: svelte, the kit packages and svelte-check peer on each other's
#   release line.
# - `alchemy`: `alchemy` and its `@alchemy.run/*` provider packages, which
#   share one exact release and peer on `alchemy` at it.
#
# Ignored version updates (security updates stay enabled, because each ignore
# is scoped to `version-update:*` types):
# - `typescript` majors: it is the TS6 alias (`npm:@typescript/typescript6`)
#   that every JS-API consumer `require`s; Dependabot proposes TS7 there, which
#   breaks them (AGENTS.md, "TypeScript is split 6/7").
# - `drizzle-orm`: pinned to drizzle 1.0's tagged release candidate, which
#   effect-auth-drizzle's declarations are built on; npm's `latest` is still
#   the 0.4x line, which the package no longer supports (#735). Moved by hand,
#   with `drizzleApplicationsPin` in scripts/check-dist.ts.
#
# Moved by hand, because Dependabot cannot (AGENTS.md lists them too):
# - the npm-alias catalog entries: `vite` (`npm:@voidzero-dev/vite-plus-core`,
#   must equal `vite-plus`; `pnpm exec vp migrate` re-pins it, then drop the
#   `minimumReleaseAgeExclude` entries it adds), `typescript`
#   (`npm:@typescript/typescript6`) and `@typescript/native` (`npm:typescript`,
#   a version `@effect/tsgo`'s components table supports). Put them on the
#   `toolchain` PR's branch.
# - `@effect/tsgo` itself when a `vite-plus` bump outruns it: that PR fails at
#   `pnpm install` until a release whose table covers the new oxlint lands.
# - the exact `alchemy` / `@alchemy.run/cloudflare` peers in
#   `catalogs.alchemy-peers`, moved on the `alchemy` PR's branch to the
#   release the applications pin.
# - the transitive advisory floors in pnpm-workspace.yaml's `overrides`.
#   (The `vite@*` / `vitest@*` overrides read the catalog, so they follow.)
# - the `ghcr.io/voidzero-dev/vite-plus:<tag>` image in .devcontainer/devcontainer.json:
#   it equals the catalog's `vite-plus` pin, moved on the toolchain PR.
#
# `cooldown` is 1 day (Dependabot counts whole days only), longer than pnpm's
# `minimumReleaseAge` of 480 minutes (8 hours), so a Dependabot PR never
# proposes a version pnpm would still refuse. `@thomasfosterau/*` is exempt
# from both.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      # vite-plus pins vitest/oxlint exactly; @effect/tsgo's patch supports only listed oxlint versions.
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
      # One release train; @effect/docgen depends on effect at its own release's floor.
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
      # svelte, the kit packages and svelte-check peer on each other's versions.
      svelte:
        applies-to: version-updates
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "svelte-check"
      # Every `@alchemy.run/*` provider peers on `alchemy` at its own exact version.
      alchemy:
        applies-to: version-updates
        patterns:
          - "alchemy"
          - "@alchemy.run/*"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-orm"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
    assignees:
      - thomasfosterau
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
  # The dev container's features (.devcontainer/devcontainer.json) and their
  # lockfile. The base image tag is not a feature: it is the catalog's
  # `vite-plus` pin, moved by hand on the toolchain PR.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
