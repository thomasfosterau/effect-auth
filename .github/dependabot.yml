# Dependabot version-update configuration (the library standard's, via
# effect-jsonapi / effect-drizzle-ext).
#
# `groups` collect dependencies that MUST move together: the Effect 4 release
# line is a lockstep-versioned singleton set (effect plus the @effect/sql-*
# drivers pinned to the same exact version); the vitest toolchain is pinned to
# vite-plus's exact versions, so its *version* updates are ignored while
# SECURITY updates stay enabled (the ignore is scoped to the
# `version-update:semver-*` update types; a bare `dependency-name` ignore would
# block security updates too) — bump vite-plus, vite and vitest together by
# hand in pnpm-workspace.yaml.
#
# The TypeScript set's version updates are ignored the same way (security
# updates stay enabled): `@effect/tsgo`, `typescript` (the TS6 alias) and
# `@typescript/native` (TS7) pin to each other, since `effect-tsgo patch`
# matches the native tsc and oxlint by gitHead / version and hard-errors on any
# pairing it has no artifact for, so a Dependabot PR that moves one alone goes
# red. They move by hand as a set together with vite-plus, after checking the
# `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs. For the
# same reason `@effect/tsgo` is excluded from the `effect` group's `@effect/*`
# pattern. `@vitest/coverage-istanbul` must equal the vitest that vite-plus
# bundles, so it is ignored the same way. The `toolchain` group collects the
# security updates of that whole move-together set into one PR.
#
# `cooldown` mirrors pnpm 11's default `minimumReleaseAge` (1440 minutes, one
# day): Dependabot never proposes a release pnpm would refuse to install.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: security-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
          - "typescript"
          - "@typescript/native"
      effect:
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
      frameworks:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "svelte"
          - "svelte-check"
          - "@sveltejs/*"
          - "vue"
          - "vue-tsc"
          - "@vitejs/plugin-vue"
          - "solid-js"
          - "vite-plugin-solid"
    ignore:
      - dependency-name: "@effect/tsgo"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "typescript"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@typescript/native"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vitest"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@vitest/coverage-istanbul"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite-plus"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      # The commit-suffixed drizzle 1.0 prerelease is pinned to what the
      # applications run; it moves with them, not with npm's `latest`.
      - dependency-name: "drizzle-orm-effect"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
