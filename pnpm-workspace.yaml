# Every external version lives here (`catalogMode: strict`); package.json files
# use `catalog:`, a named catalog or `workspace:`. `effect` must be a singleton.
packages:
  - "packages/*"

catalogMode: strict

catalog:
  "@changesets/cli": ^3.0.3
  "@effect/docgen": ^4.1.4
  "@effect/language-service": ^0.87.5
  "@effect/sql-pg": 4.1.5
  "@effect/sql-pglite": 4.1.5
  # Patches `@typescript/native` and vite-plus's oxlint and tsrs; moves with them (see its `components` table).
  "@effect/tsgo": 0.73.2
  "@electric-sql/pglite": ^0.5.17
  "@enfect/oxlint": ^0.10.0
  # CVE fixes in 5.1.0; never lower the floor below it.
  "@node-saml/node-saml": ^5.2.0
  "@sveltejs/package": ^3.0.3
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  "@testing-library/svelte": ^5.4.2
  "@types/better-sqlite3": ^9.6.0
  # Exact: the argon2 adapter embeds this release's wasm.
  "@thomasfosterau/argon2": 0.1.1
  "@thomasfosterau/effect-connect": ^0.2.1
  "@thomasfosterau/effect-jsonapi": ^0.22.2
  "@types/node": ^26.6.6
  "@types/pg": ^8.15.0
  "@types/semver": ^7.8.0
  # Must equal the vitest vite-plus bundles.
  "@vitest/coverage-istanbul": 5.1.0
  "@alchemy.run/cloudflare": 2.0.0-beta.87
  alchemy: 2.0.0-beta.87
  better-sqlite3: ^13.2.0
  # The tagged rc; `drizzleApplicationsPin` in scripts/check-dist.ts tracks the apps' build.
  drizzle-orm: 1.0.0-rc.5
  effect: 4.1.5
  fallow: 3.46.0
  jsdom: ^31.0.1
  semver: ^7.8.6
  svelte: ^5.58.0
  svelte-check: ^4.7.8
  # Only for @effect/docgen, which spawns it.
  tsx: ^4.23.15
  # TS6 for JS-API consumers (svelte-check, docgen, editors); `@typescript/native` is TS7.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite` and `vitest` equal what vite-plus depends on (`npm view vite-plus@<v>
  # dependencies`), not vite-plus itself; the devcontainer image tag follows vite-plus.
  vite-plus: 1.7.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  workerd: 1.20261119.1
  xml-crypto: ^6.4.0

# Published peer ranges.
catalogs:
  peers:
    "@thomasfosterau/effect-jsonapi": ^0.22.2
    "@node-saml/node-saml": ^5.2.0
    # Raised from ^4.0.0: the core uses `effect/crypto` (4.1) and its `Password` module (4.1.5).
    effect: ^4.1.5
    svelte: ^5.20.0
  drizzle-peers:
    drizzle-orm: ">=1.0.0-rc.5 <2"
  alchemy-peers:
    # Exact, as the applications pin them; alchemy peers on effect ^4.1.4.
    "@alchemy.run/cloudflare": 2.0.0-beta.87
    alchemy: 2.0.0-beta.87
    "@effect/sql-pg": ^4.1.0
    # The core's floor: alchemy peers on effect ^4.1.4, the core on ^4.1.5.
    effect: ^4.1.5

overrides:
  effect: "catalog:"
  # Advisory floors for transitive dev-toolchain dependencies (`pnpm audit`).
  "brace-expansion@5": ">=5.0.11"
  "js-yaml@3": ">=3.15.2"
  "nanoid@3": ">=3.3.18"
  "postcss@8": ">=8.5.18"
  "launch-editor@2": ">=2.14.2"
  "shell-quote@1": ">=1.11.0"
  "source-map-js@1": ">=1.2.2"
  # vite-plus's managed overrides.
  "vite@*": "catalog:"
  "vitest@*": "catalog:"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  fallow: true
  msgpackr-extract: true
  workerd: false

# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]

skills:
  dirs: [.claude/skills]

# Supply-chain delay, in minutes.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
